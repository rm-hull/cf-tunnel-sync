version: "2"
linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - noctx
    - revive
    - staticcheck
    - errcheck
    - govet
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofumpt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
